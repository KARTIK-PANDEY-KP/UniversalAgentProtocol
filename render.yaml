services:
  - type: web
    name: brainbase-model-runtime
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: EXECUTOR_MODE
        value: portkey
      - key: REGISTRY_MODE
        value: supabase
      - key: STORAGE_MODE
        value: supabase
      - key: PORTKEY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
