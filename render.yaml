# Deployment for the UAP gateway. docs/operations/running.md explains what each
# setting does; the notes here cover only what is specific to Render.
services:
  - type: web
    name: uap-gateway
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/KARTIK-PANDEY-KP/brainbase-model-runtime
    branch: main
    healthCheckPath: /healthz
    # The build needs devDependencies, so this is a plain install rather than
    # --prod. corepack pins pnpm to the version in packageManager.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/gateway-api/dist/main.js
    envVars:
      # node:sqlite stops needing a flag at 22.13, and the storage layer is
      # built on it, so this floor is not decorative.
      - key: NODE_VERSION
        value: 22.14.0

      # Every OAuth redirect_uri the gateway registers is derived from this, so
      # it has to be the public URL rather than the bind address. Render sets
      # RENDER_EXTERNAL_URL to exactly that.
      - key: GATEWAY_BASE_URL
        fromService:
          type: web
          name: uap-gateway
          envVarKey: RENDER_EXTERNAL_URL

      # State lives off the instance, which is the only way it survives here:
      # the free plan has no disk and an ephemeral filesystem, so a SQLite file
      # would be gone on every deploy, restart and idle spin-down, taking the
      # stored OAuth grants with it. Set out of band, like the other secrets.
      - key: GATEWAY_DATABASE_URL
        sync: false

      # Keeps the tables out of `public`, which Supabase publishes over HTTP
      # through PostgREST. These tables hold credentials.
      - key: GATEWAY_DATABASE_SCHEMA
        value: uap

      # Set out of band: see the deploy notes. Values are not in the repo.
      - key: GATEWAY_API_KEYS
        sync: false
      - key: GATEWAY_ENCRYPTION_KEYS
        sync: false
      # Unset, the gateway generates a signing key at boot. Authorization
      # servers cache our JWKS, so a key that changes on restart makes them
      # reject client assertions signed by the new one.
      - key: GATEWAY_SIGNING_KEY
        sync: false

      - key: LOG_LEVEL
        value: info

    # A single instance on one VM can use a file instead, by attaching a disk
    # (paid plans only) and setting GATEWAY_DATABASE_FILE to a path on it in
    # place of GATEWAY_DATABASE_URL:
    #
    # disk:
    #   name: gateway-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # The background worker wants its own service. It is left out here because
    # the free plan does not offer one; with Postgres it no longer needs to
    # share a machine with the API, only the database.
    #
    # - type: worker
    #   name: uap-worker
    #   runtime: node
    #   buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    #   startCommand: node apps/background-worker/dist/main.js
